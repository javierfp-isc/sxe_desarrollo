site_name: "Unidad 5 · Desarrollo de Módulos en Odoo"
site_description: "Documentación de la unidad 5 · Desarrollo de Módulos en Odoo"
site_author: Javier Fernández Peón

theme:
  name: material
  language: es
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    # Navegación mejorada
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.instant
    # Búsqueda
    - search.highlight
    - search.share
    - search.suggest
    # Contenido
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    # Tema claro
    - scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    # Tema oscuro
    - scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Fira Code

nav:
- Documentación:
  - 'Unidad 5.1 · Creación de Módulos en Odoo: Estructura y Componentes': conceptos/1-modulos-odoo.md
  - 'Unidad 5.2 · Modelos de Datos en Odoo: Creación y Gestión': conceptos/2-modelos-odoo.md
  - 'Unidad 5.3 · Vistas en Odoo: Definición y Configuración': conceptos/3-vistas-odoo.md
  - 'Unidad 5.4 · Acciones en Odoo: Definición y Configuración': conceptos/4-acciones-odoo.md
  - 'Unidad 5.5 · Seguridad en Odoo: Definición y Configuración': conceptos/5-seguridad-odoo.md

plugins:
  - search:
      lang: es
      separator: '[\s\-\.]'
  - mermaid2

markdown_extensions:
  # Básico
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.slugify
  - attr_list
  
  # Código
  - fenced_code
  - codehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      use_pygments: true
      linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  
  # Características avanzadas
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/isc-despliegue/sxe_desarrollo
  generator: false

extra_css:
  - stylesheets/extra.css