services:
  mkdocs:
    image: python:3.12-slim
    working_dir: /site
    command: >
      sh -c "pip install --no-cache-dir
      'mkdocs>=1.6,<2'
      'mkdocs-material>=9.5,<10'
      'mkdocs-mermaid2-plugin'
      && mkdocs serve --config-file mkdocs.yml --dev-addr 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8888:8000"
    volumes:
      - ./:/site:ro
    restart: unless-stopped
