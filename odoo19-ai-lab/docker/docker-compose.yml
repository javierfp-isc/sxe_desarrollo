services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: ${ODOO_IMAGE:-odoo:19.0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro

      # Fuentes OCB/OCA del host: solo lectura.
      - ${ODOO_SRC_HOST:?Define ODOO_SRC_HOST en .env}:/opt/odoo/src:ro

      # Addons desarrollados por el alumno.
      # Este montaje se superpone deliberadamente
      # sobre /opt/odoo/src/extra-addons.
      - ../addons:/opt/odoo/src/extra-addons

    command: ["odoo", "--config=/etc/odoo/odoo.conf"]
    restart: unless-stopped

volumes:
  pgdata:
