stages:
  - quality

# Plantilla inicial: completar cuando se conozca la imagen y el runner disponibles.
# No ejecuta aún tests Odoo porque necesita una base de datos y un entorno de addons.
check-addon:
  stage: quality
  image: python:3.12-slim
  script:
    - python -m compileall -q addons
    - echo "Añadir aquí validación XML, lint y tests Odoo."
